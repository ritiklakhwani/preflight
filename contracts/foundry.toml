[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
whitechain_sepolia = "${WHITECHAIN_RPC_URL}"
base = "${BASE_RPC_URL}"

# Whitechain verifies through Blockscout. The trailing /api/ is required.
# forge verify-contract <addr> src/CaplineVault.sol:CaplineVault \
#   --verifier blockscout --verifier-url https://explorer.testnet.whitechain.io/api/
