services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: preflight
      POSTGRES_DB: preflight
    ports: ["5432:5432"]
    volumes: ["./.pgdata:/var/lib/postgresql/data"]
    # `docker compose up -d` returns when the container starts, not when
    # Postgres accepts connections. Without this, `db:up && db:init` races and
    # the schema silently never gets created.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d preflight"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
